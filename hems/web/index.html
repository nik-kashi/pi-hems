<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c1018">
<title>HEMS</title>
<style>
  :root {
    --bg: #0c1018; --card: #151a26; --tile: #1a202e; --line: #262d3d;
    --fg: #f0f0f0; --muted: #8c96aa; --red: #ff7864;
    --solar: #ffc83c; --grid: #5aa0ff; --battery: #50d278; --home: #dfe4ee; --price: #dc78dc;
    --gridline: #1f2533;
    --charge: #40a860; --discharge: #cc7830; --bypass: #78467d; --past: #4b3250; --now: #ffebff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
         grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start; }
  header { max-width: 1080px; margin: 0 auto; padding: 16px 16px 0; display: flex;
           align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; }
  #clock { color: var(--muted); }
  #weather { margin-left: auto; font-size: 18px; font-weight: 700; }
  #updated { width: 100%; font-size: 12px; color: var(--muted); }
  #updated.stale { color: var(--red); }
  .card { background: var(--card); border-radius: 14px; padding: 16px; min-width: 0; }
  .card h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .04em;
             text-transform: uppercase; color: var(--muted); }
  svg { display: block; width: 100%; height: auto; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .big { font-size: 40px; font-weight: 700; line-height: 1; }
  .unit { font-size: 16px; font-weight: 400; color: var(--muted); }
  .muted { color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
  .mode { font-size: 22px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 6px 4px; border-top: 1px solid var(--line); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .bars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 6px 0 4px; }
  .bar > div { height: 100%; border-radius: 4px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }

  /* price history sheet: a dialog on wide screens, full screen on a phone */
  #chart { cursor: pointer; }
  .link { background: none; border: 0; padding: 0; color: var(--price); font: 600 12px system-ui, sans-serif; cursor: pointer; }
  .link:hover { text-decoration: underline; }
  .sheet { position: fixed; inset: 0; z-index: 20; background: rgba(5, 8, 12, .75); display: flex;
           align-items: center; justify-content: center; padding: 16px; }
  .sheet[hidden] { display: none; }
  .sheet > .card { width: min(100%, 980px); max-height: 100%; overflow-y: auto; border: 1px solid var(--line); }
  @media (max-width: 600px) {
    .sheet { padding: 0; }
    .sheet > .card { height: 100%; border-radius: 0; border: 0;
                     padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left)); }
  }
  .phead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .phead h2 { margin: 0; flex: 1; }
  .seg { display: inline-flex; background: var(--tile); border-radius: 999px; padding: 3px; }
  .seg button { background: none; border: 0; color: var(--muted); font: 600 12px system-ui, sans-serif; padding: 5px 11px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--line); color: var(--fg); }
  .seg button:focus-visible, .close:focus-visible, .link:focus-visible, #hist:focus-visible { outline: 2px solid var(--price); outline-offset: 2px; }
  .close { background: var(--tile); border: 0; color: var(--fg); width: 32px; height: 32px; border-radius: 50%; font-size: 17px; cursor: pointer; }
  .scope { font-size: 13px; margin: -4px 0 8px; min-height: 19px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--tile); border-radius: 10px; padding: 10px 12px; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stat.c .v { color: #50d278; } .stat.d .v { color: #ff963c; } .stat.p .v { color: var(--price); }
  #hist { min-height: 120px; touch-action: pan-y; }
  #hist svg { width: 100%; height: auto; }
  .legend i.ln { height: 3px; width: 14px; vertical-align: 3px; border-radius: 2px; }
</style>
</head>
<body>
<header>
  <h1>HEMS</h1>
  <span id="clock">–</span>
  <span id="weather"></span>
  <span id="updated">connecting…</span>
</header>
<main>
  <section class="card" aria-labelledby="h-flow">
    <h2 id="h-flow">Energy flow</h2>
    <div id="flow"></div>
  </section>

  <section class="card" aria-labelledby="h-price">
    <div class="row" style="align-items:center"><h2 id="h-price">Price</h2><button class="link" type="button" id="hist-open">History ›</button></div>
    <div class="row">
      <div><span class="big" id="price">–</span> <span class="unit">¢/kWh</span></div>
      <span class="muted" id="level"></span>
    </div>
    <div id="chart" style="margin-top: 12px;" title="Open price history"></div>
    <div class="legend">
      <span><i style="background: var(--charge)"></i>charge</span>
      <span><i style="background: var(--discharge)"></i>discharge</span>
      <span><i style="background: var(--bypass)"></i>bypass</span>
      <span><i style="background: var(--now)"></i>now</span>
    </div>
  </section>

  <section class="card" aria-labelledby="h-plan">
    <h2 id="h-plan">Plan</h2>
    <div class="row">
      <span class="mode" id="mode">–</span>
      <span class="muted" id="net"></span>
    </div>
    <p class="muted" id="plansum" style="margin: 6px 0 10px;"></p>
    <table><tbody id="segments"></tbody></table>
  </section>

  <section class="card" aria-labelledby="h-exec">
    <h2 id="h-exec">Executor</h2>
    <dl id="exec"></dl>
  </section>

  <section class="card" aria-labelledby="h-sys">
    <h2 id="h-sys">System</h2>
    <div class="bars" id="sys"></div>
  </section>
</main>

<div class="sheet" id="hist-sheet" hidden>
  <section class="card" id="hist-card" tabindex="-1" style="outline: none" role="dialog" aria-modal="true" aria-labelledby="h-hist">
    <div class="phead">
      <h2 id="h-hist">Price history</h2>
      <div class="seg" id="hist-seg" role="group" aria-label="Range">
        <button type="button" data-n="14">14 d</button>
        <button type="button" data-n="30">30 d</button>
        <button type="button" data-n="90">90 d</button>
        <button type="button" data-n="year">1 year</button>
      </div>
      <button class="close" type="button" id="hist-close" aria-label="Close">×</button>
    </div>
    <div class="scope" id="hist-scope" aria-live="polite"></div>
    <div class="stats" id="hist-stats"></div>
    <div id="hist" tabindex="0"></div>
    <div class="legend">
      <span><i class="ln" style="background: #50d278"></i>avg price when charging</span>
      <span><i class="ln" style="background: #ff963c"></i>avg price when discharging</span>
      <span><i class="ln" style="background: var(--price)"></i>Tibber average</span>
      <span><i style="background: var(--charge)"></i>charged from grid</span>
      <span><i style="background: var(--discharge)"></i>discharged</span>
    </div>
  </section>
</div>

<script>
const C = { solar: '#ffc83c', grid: '#5aa0ff', battery: '#50d278', home: '#dfe4ee',
            tile: '#1a202e', line: '#262d3d', fg: '#f0f0f0', muted: '#8c96aa', bg: '#0c1018', red: '#ff7864',
            CHARGE: '#40a860', DISCHARGE: '#cc7830', BYPASS: '#78467d', past: '#4b3250', now: '#ffebff' };
const MODE = { CHARGE: '#50d278', DISCHARGE: '#ff963c', BYPASS: '#96a0b4' };
const PHASE = ['#a8d4ff', '#5aa0ff', '#2c5fb8'];
const STRING = ['#ffeca0', '#ffd45a', '#ebaa1e', '#be7d0a', '#965f05', '#784b05'];
const WX = { clear: ['☀️', '🌙'], partly: ['⛅', '☁️'], cloudy: ['☁️', '☁️'], fog: ['🌫️', '🌫️'],
             rain: ['🌧️', '🌧️'], snow: ['🌨️', '🌨️'], thunder: ['⛈️', '⛈️'] };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hm = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const isToday = iso => new Date(iso).toDateString() === new Date().toDateString();
const day = iso => new Date(iso).toLocaleDateString([], { weekday: 'short' });

// ---------- energy flow (same geometry as the TFT) ----------
const POS = { solar: [12, 44], grid: [192, 44], battery: [12, 180], home: [192, 180] };
function tile(key, label, col, value, unit, ok, extra) {
  const [x, y] = POS[key];
  const c = ok ? col : C.muted;
  return `<rect x="${x}" y="${y}" width="116" height="92" rx="12" fill="${C.tile}" stroke="${ok ? col : '#464c5a'}" stroke-width="2"/>
    <text x="${x + 10}" y="${y + 20}" fill="${c}" font-size="13">${label}${extra && extra.tag ? `<tspan fill="${C.muted}" font-size="9"> ${esc(extra.tag)}</tspan>` : ''}</text>
    ${ok ? '' : `<text x="${x + 106}" y="${y + 20}" fill="${C.red}" font-size="10" text-anchor="end">offline</text>`}
    <text x="${x + 106}" y="${y + (extra && extra.parts ? 52 : 60)}" text-anchor="end" fill="${ok ? C.fg : C.muted}"
      font-size="${extra && extra.parts ? 22 : 26}" font-weight="700">${esc(value)}<tspan font-size="13" font-weight="400"> ${unit}</tspan></text>
    ${extra && extra.sub ? `<text x="${x + 10}" y="${y + 82}" fill="${C.muted}" font-size="11">${esc(extra.sub)}</text>` : ''}
    ${extra && extra.parts ? stacked(x, y, extra.parts, extra.cols) : ''}`;
}
function stacked(x, y, parts, cols) {
  const tot = parts.reduce((a, v) => a + Math.abs(v), 0);
  let out = `<rect x="${x + 10}" y="${y + 60}" width="96" height="6" rx="3" fill="#282e3c"/>`;
  let cx = x + 10;
  parts.forEach((v, k) => {
    const w = tot ? 96 * Math.abs(v) / tot : 0;
    if (w > 0.3) out += `<rect x="${cx}" y="${y + 60}" width="${w}" height="6" fill="${v < 0 ? C.solar : cols[k]}"/>`;
    cx += w;
  });
  const n = parts.length;
  parts.forEach((v, k) => {
    const tx = n === 1 ? x + 10 : x + 10 + 96 * k / (n - 1);
    const anchor = k === 0 ? 'start' : (k === n - 1 ? 'end' : 'middle');
    out += `<text x="${tx}" y="${y + 80}" font-size="9" text-anchor="${anchor}" fill="${v < 0 ? C.solar : cols[k]}">${v < 0 ? '−' + Math.abs(v) : v}</text>`;
  });
  return out;
}
function arrow(x1, y1, x2, y2, col, on) {
  if (!on) return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.line}" stroke-width="2"/>`;
  const a = Math.atan2(y2 - y1, x2 - x1), hx = x2 - 7 * Math.cos(a), hy = y2 - 7 * Math.sin(a);
  const l = [hx + 5 * Math.cos(a + Math.PI / 2), hy + 5 * Math.sin(a + Math.PI / 2)];
  const r = [hx + 5 * Math.cos(a - Math.PI / 2), hy + 5 * Math.sin(a - Math.PI / 2)];
  return `<line x1="${x1}" y1="${y1}" x2="${hx}" y2="${hy}" stroke="${col}" stroke-width="3"/>
          <polygon points="${x2},${y2} ${l} ${r}" fill="${col}"/>`;
}
function pill(cx, cy, txt, col) {
  const w = txt.length * 6.2 + 10;
  return `<rect x="${cx - w / 2}" y="${cy - 7}" width="${w}" height="14" rx="7" fill="${C.bg}" stroke="${col}"/>
          <text x="${cx}" y="${cy + 3.5}" font-size="10" font-weight="700" text-anchor="middle" fill="${col}">${txt}</text>`;
}
function renderFlow(s) {
  const p1 = s && s.p1, sf = s && s.sf, f = (s && s.flows) || {};
  const on = k => (f[k] || 0) >= 15;
  let g = '';
  g += arrow(132, 90, 188, 90, C.solar, on('solar_grid'));
  g += arrow(132, 140, 188, 176, C.solar, on('solar_home'));
  g += arrow(70, 139, 70, 175, C.solar, on('solar_battery'));
  g += on('battery_grid') ? arrow(133, 175, 188, 140, C.battery, true)   // same line, either direction
                          : arrow(188, 140, 133, 175, C.grid, on('grid_battery'));
  g += arrow(250, 139, 250, 175, C.grid, on('grid_home'));
  g += arrow(131, 226, 187, 226, C.battery, on('battery_home'));
  if (sf) {
    const st = sf.strings_w || [];
    g += tile('solar', 'Solar', C.solar, sf.solar_w, 'W', true, { tag: st.length ? `${st.length} strings` : '', parts: st, cols: STRING });
    const bsub = sf.bat_charge_w > 0 ? `charging ${sf.bat_charge_w} W` : sf.bat_discharge_w > 0 ? `discharging ${sf.bat_discharge_w} W` : 'idle';
    g += tile('battery', 'Battery', C.battery, sf.soc, '%', true, { sub: bsub });
  } else {
    g += tile('solar', 'Solar', C.solar, '–', 'W', false) + tile('battery', 'Battery', C.battery, '–', '%', false);
  }
  g += p1 ? tile('grid', 'Grid', C.grid, Math.abs(p1.grid_w), 'W', true,
                 { tag: p1.grid_w >= 0 ? 'import' : 'export', parts: p1.phases_w, cols: PHASE })
          : tile('grid', 'Grid', C.grid, '–', 'W', false);
  g += tile('home', 'Home', C.home, s && s.home_w != null ? s.home_w : '–', 'W', s && s.home_w != null, { sub: 'consumption' });
  if (on('solar_grid')) g += pill(160, 90, `${f.solar_grid} W`, C.solar);
  if (on('solar_battery')) g += pill(70, 157, `${f.solar_battery} W`, C.solar);
  if (on('grid_home')) g += pill(250, 157, `${f.grid_home} W`, C.grid);
  if (on('battery_home')) g += pill(160, 226, `${f.battery_home} W`, C.battery);
  const both = (on('grid_battery') || on('battery_grid')) && on('solar_home');
  if (on('battery_grid')) g += pill(160, both ? 150 : 158, `${f.battery_grid} W`, C.battery);
  else if (on('grid_battery')) g += pill(160, both ? 150 : 158, `${f.grid_battery} W`, C.grid);
  if (on('solar_home')) g += pill(160, both ? 167 : 158, `${f.solar_home} W`, C.solar);
  document.getElementById('flow').innerHTML =
    `<svg viewBox="4 36 312 244" role="img" aria-label="Energy flow between solar, grid, battery and home"
          font-family="system-ui, sans-serif">${g}</svg>`;
}

// ---------- price chart ----------
function renderPrices(prices, plan) {
  const now = new Date();
  const modes = {};
  ((plan && plan.slots) || []).forEach(s => modes[new Date(s.start).getTime()] = s.mode);
  const cur = prices.find(p => { const t = new Date(p.start); return t <= now && now < new Date(t.getTime() + 9e5); });
  document.getElementById('price').textContent = cur ? Math.round(cur.price * 100) : '–';
  document.getElementById('level').textContent = cur ? cur.level.replace('_', ' ').toLowerCase() : 'no price data';
  if (!prices.length) { document.getElementById('chart').innerHTML = ''; return; }
  const vals = prices.map(p => p.price), lo = Math.min(...vals), hi = Math.max(...vals), span = Math.max(hi - lo, 1e-6);
  const H = 90, d0 = new Date(prices[0].start); d0.setHours(0, 0, 0, 0);
  let bars = '', x = 0;
  prices.forEach(p => {
    const t = new Date(p.start), dayIdx = Math.round((new Date(t).setHours(0, 0, 0, 0) - d0) / 864e5);
    const i = dayIdx * 96 + t.getHours() * 4 + Math.floor(t.getMinutes() / 15);
    x = i * 3 + dayIdx * 6;
    const h = 6 + (H - 6) * (p.price - lo) / span;
    const end = new Date(t.getTime() + 9e5);
    const col = (t <= now && now < end) ? C.now : end <= now ? C.past : (C[modes[t.getTime()]] || C.BYPASS);
    bars += `<rect x="${x}" y="${H - h}" width="2.4" height="${h}" fill="${col}"><title>${day(p.start)} ${hm(p.start)}  ${(p.price * 100).toFixed(1)} ¢  ${modes[t.getTime()] || ''}</title></rect>`;
  });
  const W = x + 3;
  const ticks = [];
  for (let d = 0; d * 96 * 3 < W; d++) for (const hr of [0, 6, 12, 18]) {
    const tx = (d * 96 + hr * 4) * 3 + d * 6;
    if (tx < W - 20) ticks.push(`<span style="position:absolute;left:${(100 * tx / W).toFixed(2)}%">${hr === 0 ? (d === 0 ? 'today' : 'tomorrow') : String(hr).padStart(2, '0')}</span>`);
  }
  document.getElementById('chart').innerHTML =
    `<div style="display:flex;gap:8px;align-items:stretch">
       <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:110px;flex:1;min-width:0" role="img"
            aria-label="15-minute prices, coloured by planned battery mode">${bars}</svg>
       <div class="muted" style="display:flex;flex-direction:column;justify-content:space-between;font-size:11px;text-align:right">
         <span>${(hi * 100).toFixed(0)}¢</span><span>${(lo * 100).toFixed(0)}¢</span></div>
     </div>
     <div class="muted" style="position:relative;height:16px;font-size:11px;margin-right:34px">${ticks.join('')}</div>`;
}

// ---------- plan ----------
function renderPlan(plan) {
  if (!plan) { document.getElementById('mode').textContent = 'no plan'; return; }
  const s0 = plan.slots[0];
  const m = document.getElementById('mode');
  m.textContent = s0.mode + (s0.power_w ? ` ${s0.power_w} W` : '');
  m.style.color = MODE[s0.mode];
  document.getElementById('net').textContent = `€${(plan.grid_saving_eur - plan.wear_eur).toFixed(2)} net`;
  document.getElementById('plansum').textContent =
    `Charge ${plan.charged_kwh} kWh, discharge ${plan.discharged_kwh} kWh · battery now ${plan.soc_now}%` +
    (plan.max_soc != null ? ` (limits ${plan.min_soc}–${plan.max_soc}%)` : '') + ` · planned ${hm(plan.created)}` +
    (plan.shadow ? ' · shadow mode' : '');
  const segs = [];
  plan.slots.forEach(s => {
    const last = segs[segs.length - 1];
    if (last && last.mode === s.mode) { last.end = s.start; last.prices.push(s.price); last.soc = s.soc_end; }
    else segs.push({ mode: s.mode, start: s.start, end: s.start, prices: [s.price], soc: s.soc_end });
  });
  document.getElementById('segments').innerHTML = segs.slice(0, 10).map(g => {
    const end = new Date(new Date(g.end).getTime() + 9e5).toISOString();
    const pmin = Math.min(...g.prices) * 100, pmax = Math.max(...g.prices) * 100;
    const when = (isToday(g.start) ? '' : day(g.start) + ' ') + `${hm(g.start)}–${hm(end)}`;
    const pr = pmin.toFixed(0) === pmax.toFixed(0) ? `${pmin.toFixed(0)}¢` : `${pmin.toFixed(0)}–${pmax.toFixed(0)}¢`;
    return `<tr><td style="white-space:nowrap">${when}</td>
      <td><span class="pill" style="background:${MODE[g.mode]}22;color:${MODE[g.mode]}">${g.mode.toLowerCase()}</span></td>
      <td class="num" style="white-space:nowrap">${pr}</td><td class="num" style="white-space:nowrap">→${Math.round(g.soc)}%</td></tr>`;
  }).join('');
}

// ---------- executor & system ----------
function renderExec(ex, st) {
  const el = document.getElementById('exec');
  if (!ex) { el.innerHTML = '<dt>status</dt><dd>not running</dd>'; return; }
  const age = (st - ex.ts).toFixed(0);
  const d = ex.device || {};
  el.innerHTML = `<dt>mode</dt><dd style="color:${MODE[ex.mode] || C.fg}">${ex.mode}${ex.dry_run ? ' (dry run)' : ' · live'}</dd>
    <dt>device</dt><dd>acMode ${d.acMode} · in ${d.inputLimit} W · out ${d.outputLimit} W · smartMode ${d.smartMode}</dd>
    <dt>grid</dt><dd>${ex.grid_w != null ? ex.grid_w + ' W' : '–'}</dd>
    <dt>last step</dt><dd${age > 15 ? ' style="color:#ff7864"' : ''}>${age} s ago</dd>`;
}
function renderSys(r) {
  if (!r) return;
  const item = (name, pct, col, sub) => `<div><div class="row"><span class="muted">${name}</span><span>${pct.toFixed(0)}%</span></div>
    <div class="bar"><div style="width:${Math.min(100, pct)}%;background:${col}"></div></div><div class="muted" style="font-size:12px">${sub}</div></div>`;
  const gb = v => (v >= 9.95 ? v.toFixed(0) : v.toFixed(1)) + ' GB';
  document.getElementById('sys').innerHTML =
    item('CPU', r.cpu, '#78b4ff', `${r.cores} cores · ${r.temp.toFixed(0)}°C`) +
    item('RAM', r.ram, '#96dca0', 'of ' + gb(r.ram_gb)) +
    item('Disk', r.disk, '#e6be78', 'of ' + gb(r.disk_gb));
}

// ---------- loop ----------
async function tick() {
  const up = document.getElementById('updated');
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    const d = await r.json();
    const s = d.state;
    const age = s ? d.server_time - s.ts : Infinity;
    up.textContent = s ? `updated ${age.toFixed(0)} s ago` : 'no live data';
    up.classList.toggle('stale', age > 15);
    document.getElementById('clock').textContent =
      new Date().toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    const w = s && s.weather;
    document.getElementById('weather').textContent = w ? `${(WX[w.kind] || WX.cloudy)[w.is_day ? 0 : 1]} ${Math.round(w.temp_c)}°C` : '';
    renderFlow(s);
    renderPrices(d.prices || [], d.plan);
    renderPlan(d.plan);
    renderExec(d.executor, d.server_time);
    renderSys(s && s.res);
  } catch (e) {
    up.textContent = 'HEMS not reachable';
    up.classList.add('stale');
  }
}
// ---------- price history (opened from the price chart) ----------
const hist = { data: null, n: 30, sel: null, geom: null, drag: false };
try { const v = localStorage.getItem('hems-hist-range'); if (v) hist.n = v === 'year' ? 'year' : +v; } catch (e) {}
const hEl = id => document.getElementById(id);
const hCt = v => v == null ? '–' : (v * 100).toFixed(1) + ' ¢';
const hEur = v => (v < 0 ? '−€' : '€') + Math.abs(v).toFixed(2);
const hDay = d => d.isMonth ? d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })
                            : d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const hNice = v => { const p = 10 ** Math.floor(Math.log10(v)); return [1, 2, 2.5, 5, 10].map(m => m * p).find(x => x >= v); };

// sum days into one row (a month, or the whole range)
function histSum(rows) {
  const live = rows.filter(d => d.live);
  const pc = live.filter(d => d.chgP != null), pd = live.filter(d => d.disP != null);
  const cK = pc.reduce((a, d) => a + d.chg, 0), dK = pd.reduce((a, d) => a + d.dis, 0);
  const pa = rows.filter(d => d.avg != null);
  return {
    chg: live.reduce((a, d) => a + d.chg, 0), dis: live.reduce((a, d) => a + d.dis, 0),
    chgP: cK ? pc.reduce((a, d) => a + d.chg * d.chgP, 0) / cK : null,
    disP: dK ? pd.reduce((a, d) => a + d.dis * d.disP, 0) / dK : null,
    avg: pa.length ? pa.reduce((a, d) => a + d.avg, 0) / pa.length : null,
    live: live.length > 0, ndays: rows.length, nlive: live.length,
  };
}
function histNet(r) {
  return (r.disP != null ? r.dis * r.disP : 0) - (r.chgP != null ? r.chg * r.chgP : 0) - r.dis * hist.data.wear;
}
function histRows() {
  const all = hist.data.days;
  if (hist.n !== 'year') return all.slice(-hist.n);
  const out = [], last = all[all.length - 1].date;
  for (let k = 11; k >= 0; k--) {
    const m = new Date(last.getFullYear(), last.getMonth() - k, 1);
    const ds = all.filter(d => d.date.getFullYear() === m.getFullYear() && d.date.getMonth() === m.getMonth());
    if (!ds.length) continue;
    m.isMonth = true;
    out.push(Object.assign(histSum(ds), { date: m }));
  }
  return out;
}

function histDraw() {
  const host = hEl('hist');
  if (!hist.data || !hist.data.days.length) {
    host.innerHTML = '<p class="muted">No price history yet. It appears once the planner has saved prices.</p>';
    hEl('hist-stats').innerHTML = ''; hEl('hist-scope').textContent = '';
    return;
  }
  const days = histRows(), per = hist.n === 'year' ? 'month' : 'day';
  if (hist.sel != null && hist.sel >= days.length) hist.sel = null;
  const W = Math.max(280, host.clientWidth), narrow = W < 520;
  const padL = 8, padR = 44, top = 22, priceH = narrow ? 150 : 180, gap = 30, barsH = narrow ? 110 : 130, axisH = 22;
  const H = top + priceH + gap + barsH + axisH;
  const cw = (W - padL - padR) / days.length, cx = i => padL + cw * (i + 0.5);

  const pv = days.flatMap(d => [d.avg, d.chgP, d.disP]).filter(v => v != null);
  const step = pv.length && Math.max(...pv) - Math.min(...pv) > 0.5 ? 0.1 : 0.05;
  const lo = pv.length ? Math.floor(Math.min(...pv) / step) * step : 0;
  const hi = pv.length ? Math.max(lo + step, Math.ceil(Math.max(...pv) / step) * step) : step;
  const py = v => top + priceH - (v - lo) / (hi - lo) * priceH;
  const km = hNice(Math.max(2, ...days.map(d => Math.max(d.chg, d.dis))));
  const zero = top + priceH + gap + barsH / 2, ky = v => zero - v / km * (barsH / 2);

  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step) {
    g += `<line x1="${padL}" x2="${W - padR}" y1="${py(v)}" y2="${py(v)}" stroke="var(--gridline)"/>`;
    g += `<text x="${W - padR + 6}" y="${py(v) + 4}" font-size="11" fill="var(--muted)">${Math.round(v * 100)}¢</text>`;
  }
  [-km, -km / 2, 0, km / 2, km].forEach(v => {
    g += `<line x1="${padL}" x2="${W - padR}" y1="${ky(v)}" y2="${ky(v)}" stroke="${v === 0 ? 'var(--line)' : 'var(--gridline)'}"/>`;
    g += `<text x="${W - padR + 6}" y="${ky(v) + 4}" font-size="11" fill="var(--muted)">${+Math.abs(v).toFixed(1)}</text>`;
  });
  g += `<text x="${padL}" y="${top - 8}" font-size="10" fill="var(--muted)">price per ${per}, ¢/kWh</text>`;
  g += `<text x="${padL}" y="${top + priceH + gap - 4}" font-size="10" fill="var(--muted)">kWh per ${per} · <tspan fill="${MODE.CHARGE}">charged ↑</tspan> · <tspan fill="${MODE.DISCHARGE}">discharged ↓</tspan></text>`;

  const first = days.findIndex(d => d.live);
  if (first > 0) {
    const x = padL + cw * first;
    g += `<line x1="${x}" x2="${x}" y1="${top}" y2="${zero + barsH / 2}" stroke="var(--muted)" stroke-dasharray="3 4"/>`;
    g += `<text x="${Math.min(x, W - padR)}" y="${top - 8}" font-size="10" fill="var(--muted)" text-anchor="${x > W / 2 ? 'end' : 'start'}">HEMS live ${x > W / 2 ? '┐' : ''}</text>`;
  }
  if (hist.sel != null) g += `<rect x="${padL + cw * hist.sel}" y="${top}" width="${cw}" height="${priceH + gap + barsH}" fill="#ffffff" opacity=".06"/>`;

  const bw = Math.max(1.5, Math.min(cw * 0.62, 28));
  days.forEach((d, i) => {
    if (d.chg > 0) g += `<rect x="${cx(i) - bw / 2}" y="${ky(d.chg)}" width="${bw}" height="${zero - ky(d.chg)}" rx="1.5" fill="${C.CHARGE}"/>`;
    if (d.dis > 0) g += `<rect x="${cx(i) - bw / 2}" y="${zero}" width="${bw}" height="${ky(-d.dis) - zero}" rx="1.5" fill="${C.DISCHARGE}"/>`;
  });
  const line = (key, col) => {
    let path = '', pen = false, dots = '';
    days.forEach((d, i) => {
      const v = d[key];
      if (v == null) { pen = false; return; }
      path += `${pen ? 'L' : 'M'}${cx(i).toFixed(1)},${py(v).toFixed(1)}`; pen = true;
      const a = days[i - 1], b = days[i + 1];
      if ((!a || a[key] == null) && (!b || b[key] == null)) dots += `<circle cx="${cx(i)}" cy="${py(v)}" r="2.5" fill="${col}"/>`;
    });
    return `<path d="${path}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  };
  g += line('avg', 'var(--price)') + line('chgP', MODE.CHARGE) + line('disP', MODE.DISCHARGE);
  if (hist.sel != null) {
    const s = days[hist.sel];
    [['avg', 'var(--price)'], ['chgP', MODE.CHARGE], ['disP', MODE.DISCHARGE]].forEach(([k, c]) => {
      if (s[k] != null) g += `<circle cx="${cx(hist.sel)}" cy="${py(s[k])}" r="4" fill="var(--card)" stroke="${c}" stroke-width="2"/>`;
    });
  }
  const every = Math.ceil(days.length / (narrow ? 5 : 8));
  days.forEach((d, i) => {
    if ((days.length - 1 - i) % every) return;
    g += `<text x="${cx(i)}" y="${H - 6}" font-size="11" fill="var(--muted)" text-anchor="middle">${d.date.isMonth ? '' : d.date.getDate() + ' '}${d.date.toLocaleString('en-GB', { month: 'short' })}</text>`;
  });
  hist.geom = { padL, cw, n: days.length };
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" font-family="system-ui, sans-serif"
    aria-label="Average price when charging and discharging, Tibber average, and kWh charged and discharged per ${per}">${g}</svg>`;

  if (hist.sel == null) {
    const a = days[0].date, b = days[days.length - 1].date, f = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    histStats(histSum(hist.n === 'year' ? hist.data.days.filter(d => d.date >= a) : days),
              hist.n === 'year' ? `Last 12 months · ${hDay(a)} to ${hDay(b)}` : `Last ${days.length} days · ${f(a)} to ${f(b)}`, false);
  } else {
    histStats(Object.assign({ ndays: 1, nlive: days[hist.sel].live ? 1 : 0 }, days[hist.sel]), hDay(days[hist.sel].date), true);
  }
}

function histStats(r, label, one) {
  hEl('hist-scope').innerHTML = `<b>${esc(label)}</b>` + (one ? ' <span class="muted">· move away or lift your finger for the whole chart</span>' : '');
  const month = r.date && r.date.isMonth;
  hEl('hist-stats').innerHTML = `
    <div class="stat c"><div class="k">Charged</div><div class="v">${r.chg.toFixed(1)} kWh</div><div class="s">avg ${hCt(r.chgP)}</div></div>
    <div class="stat d"><div class="k">Discharged</div><div class="v">${r.dis.toFixed(1)} kWh</div><div class="s">avg ${hCt(r.disP)}</div></div>
    <div class="stat p"><div class="k">Tibber average</div><div class="v">${hCt(r.avg)}</div><div class="s">${one ? (month ? 'month average' : 'day average') : r.ndays + ' days'}</div></div>
    <div class="stat"><div class="k">Net after wear</div><div class="v">${r.nlive ? hEur(histNet(r)) : '–'}</div><div class="s">${!r.nlive ? 'before HEMS' : one && !month ? 'this day' : r.nlive + ' days with HEMS'}</div></div>`;
}

function histPick(clientX) {
  const svg = hEl('hist').querySelector('svg');
  if (!svg || !hist.geom) return;
  const r = svg.getBoundingClientRect(), x = (clientX - r.left) * (svg.viewBox.baseVal.width / r.width);
  const i = Math.max(0, Math.min(hist.geom.n - 1, Math.floor((x - hist.geom.padL) / hist.geom.cw)));
  if (i !== hist.sel) { hist.sel = i; histDraw(); }
}
function histClear() { if (hist.sel != null) { hist.sel = null; histDraw(); } }

async function histOpen() {
  hEl('hist-sheet').hidden = false;
  document.body.style.overflow = 'hidden';
  document.querySelectorAll('#hist-seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.n === String(hist.n)));
  hist.sel = null;
  hEl('hist-card').focus();
  if (!hist.data) { hEl('hist-scope').textContent = 'Loading…'; hEl('hist').innerHTML = ''; }
  try {
    const d = await (await fetch('/api/history', { cache: 'no-store' })).json();
    d.days.forEach(x => { const [y, m, dd] = x.date.split('-').map(Number); x.date = new Date(y, m - 1, dd); });
    hist.data = d;
  } catch (e) {
    if (!hist.data) { hEl('hist-scope').textContent = 'Could not load the history from the Pi. Close and try again.'; return; }
  }
  histDraw();
}
function histClose() {
  hEl('hist-sheet').hidden = true;
  document.body.style.overflow = '';
  hEl('hist-open').focus();
}

(function () {
  const host = hEl('hist');
  hEl('hist-open').addEventListener('click', histOpen);
  hEl('chart').addEventListener('click', histOpen);
  hEl('hist-close').addEventListener('click', histClose);
  hEl('hist-sheet').addEventListener('click', e => { if (e.target === hEl('hist-sheet')) histClose(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !hEl('hist-sheet').hidden) histClose(); });
  document.querySelectorAll('#hist-seg button').forEach(b => b.addEventListener('click', () => {
    hist.n = b.dataset.n === 'year' ? 'year' : +b.dataset.n;
    try { localStorage.setItem('hems-hist-range', b.dataset.n); } catch (e) {}
    document.querySelectorAll('#hist-seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    hist.sel = null; histDraw();
  }));
  // mouse: hover; touch: tap or press and slide sideways (vertical swipes still scroll)
  host.addEventListener('pointerdown', e => { hist.drag = true; host.setPointerCapture(e.pointerId); histPick(e.clientX); });
  host.addEventListener('pointermove', e => { if (hist.drag || e.pointerType === 'mouse') histPick(e.clientX); });
  ['pointerup', 'pointercancel'].forEach(t => host.addEventListener(t, e => { hist.drag = false; if (e.pointerType !== 'mouse') histClear(); }));
  host.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !hist.drag) histClear(); });
  host.addEventListener('blur', histClear);
  host.addEventListener('keydown', e => {
    if (!hist.geom) return;
    if (e.key === 'ArrowLeft') { hist.sel = hist.sel == null ? hist.geom.n - 1 : Math.max(0, hist.sel - 1); histDraw(); e.preventDefault(); }
    if (e.key === 'ArrowRight') { hist.sel = hist.sel == null ? 0 : Math.min(hist.geom.n - 1, hist.sel + 1); histDraw(); e.preventDefault(); }
  });
  let lastW = 0;   // redraw on width changes only (the chart sets its own height)
  new ResizeObserver(() => requestAnimationFrame(() => {
    if (hEl('hist-sheet').hidden || host.clientWidth === lastW) return;
    lastW = host.clientWidth; histDraw();
  })).observe(host);
})();

tick();
setInterval(tick, 3000);
</script>
</body>
</html>
